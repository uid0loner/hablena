{{> head}}
<body class="ah-body">
<a class="skip-link" href="#main">{{t.a11y.skip}}</a>
<header class="ah">
  <div class="ah__bar">
    <a class="brand ah__brand" href="{{appUrl}}" aria-label="Hablena – {{t.app.learnTab}}">
      <svg class="brand__mark" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="7" fill="#FFC400"/><path d="M7 19 C 10 12, 14 12, 17 17 S 24 22, 27 15" fill="none" stroke="#0A1633" stroke-width="3.2" stroke-linecap="round"/></svg>
      <span class="brand__name">hablena</span>
    </a>
    <nav class="ah__tabs" aria-label="{{t.a11y.mainNav}}">
      <a class="ah__tab is-active" href="{{appUrl}}" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5L12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg>
        <span>{{t.app.learnTab}}</span>
      </a>
      <a class="ah__tab" href="{{t.links.grammar}}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M9 9h6M9 13h4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span>{{t.nav.grammar}}</span>
      </a>
      <a class="ah__tab" href="{{t.links.conjugator}}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="18" cy="16" r="3.2" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
        <span>{{t.nav.conjugator}}</span>
      </a>
    </nav>
    <div class="ah__chips">
      <span class="ah-chip ah-chip--streak" data-chip-streak title="{{t.app.streak}}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 1.5-5 3-6 0 2 1 3 2 3 0-3-1-6 1-9z" fill="currentColor"/></svg>
        <span data-stat-streak>0</span><span class="sr-only"> {{t.app.streak}}</span>
      </span>
      <span class="ah-chip ah-chip--xp" title="{{t.app.xpTotal}}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="currentColor"/></svg>
        <span data-stat-xptotal>0</span><span class="sr-only"> XP</span>
      </span>
      <a class="ah-chip ah-chip--lang" href="{{altHref}}" hreflang="{{altLang}}" lang="{{altLang}}" aria-label="{{t.a11y.switchLang}}">{{altLabel}}</a>
      <a class="ah-avatar" href="#account" aria-label="{{t.auth.accountTitle}}" data-avatar>?</a>
    </div>
  </div>
</header>
<main id="main">{{content}}</main>
<script src="/assets/js/sfx.js" defer></script>
</body>
</html>
